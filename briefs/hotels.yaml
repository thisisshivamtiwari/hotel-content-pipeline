# Eight MADE-UP hotels in made-up towns. Not real hotels, guests or prices.
# `trigger`: words that mean a text is stating the offer; `required`: groups of alternatives, one of each group must
# then appear in the same ad unit (the offer's significant conditions).
# Each brief is everything a marketer would be told: facts, prices, one offer with its conditions, what the hotel
# does NOT have, and the footage the video team already holds (reel scenes may only use these shots).
hotels:
  - id: lantern
    name: The Lantern Rooms
    town: Pellingford
    kind: 24-room city-centre budget hotel
    audience: weekend city-break couples aged 25-40
    goal: fill Sunday to Thursday nights in January
    tone: warm, plain, a little playful
    brand: {primary: "#1f3a5f", accent: "#f2b134"}
    facts:
      - 24 rooms, all with blackout blinds and a rainfall shower
      - 4 minutes' walk from Pellingford Central station
      - self check-in kiosk, staffed reception 7am to 11pm
      - rooftop terrace open April to September
      - free Wi-Fi in every room
    prices: {room_from: "£79 a night", breakfast: "£11 per person"}
    offer:
      text: 20% off
      conditions: ["stays of 2 nights or more", "Sunday to Thursday", "book by 31 January 2027"]
      trigger: ["20%"]
      required: [["2 nights", "two nights", "2+ nights", "2-night", "two-night"], ["sunday to thursday", "sun-thu", "sunday-thursday", "sun to thu", "sundays to thursdays"]]
    not_available: [parking, pool, spa, gym, restaurant, pet-friendly, room service]
    footage: [exterior_dusk, room_wide, shower_detail, station_walk, kiosk_checkin, terrace_summer]

  - id: saltmarsh
    name: Saltmarsh Quay Guesthouse
    town: Wrenmouth
    kind: 9-room seaside guesthouse
    audience: walkers and couples who want a quiet coastal break
    goal: sell midweek winter breaks
    tone: calm, honest, unhurried
    brand: {primary: "#2d5d62", accent: "#e9dcc4"}
    facts:
      - 9 rooms, 6 with a sea view
      - cooked breakfast included in every rate
      - the coast path starts 200 metres from the door
      - drying room for boots and coats
      - owners live on site
    prices: {room_from: "£95 a night including breakfast"}
    offer:
      text: third night free
      conditions: ["Monday to Thursday arrivals", "November to February", "subject to availability"]
      trigger: ["third night", "3rd night"]
      required: [["monday to thursday", "mon-thu", "monday-thursday", "mon to thu", "mondays to thursdays"]]
    not_available: [lift, elevator, parking, restaurant, bar, pool, spa, gym, wheelchair-accessible rooms]
    footage: [sea_view_window, breakfast_table, coast_path, drying_room, harbour_morning, room_cosy]

  - id: runway
    name: Northgate Runway Hotel
    town: Stellbridge Airport
    kind: 180-room airport business hotel
    audience: business travellers and early-flight passengers
    goal: grow park-and-fly bookings
    tone: efficient, reassuring
    brand: {primary: "#222831", accent: "#00adb5"}
    facts:
      - 180 rooms with soundproofed windows
      - 24-hour shuttle to the terminal every 15 minutes
      - 24-hour gym
      - restaurant open 5am to 11pm, grab-and-go breakfast from 4am
      - 8 meeting rooms for up to 40 people
    prices: {room_from: "£109 a night", park_and_fly: "£159 with 8 days' parking"}
    offer:
      text: 8 days' parking included
      conditions: ["park-and-fly rate", "one car per booking", "non-refundable"]
      trigger: ["parking included", "8 days", "eight days", "park-and-fly", "park and fly", "park & fly"]
      required: [["non-refundable", "non refundable", "nonrefundable"]]
    not_available: [pool, spa, sauna, pet-friendly, ev charging]
    footage: [shuttle_bus, room_desk, gym_treadmill, breakfast_grab, meeting_room, car_park_gate]

